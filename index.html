<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Medidores">
<meta name="theme-color" content="#1a2033">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<title>Medidores</title>
</head>
<body>

<div id="updateBar" class="update-bar" hidden>
  <span>Hay una nueva versión de la app</span>
  <button id="updateBtn" class="btn btn-sm btn-amber">Actualizar</button>
</div>

<!-- INICIO / BUSQUEDA -->
<section id="scr-home" class="screen">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">&#9889;</span><span>Medidores</span></div>
    <button class="icon-btn" id="btnBiblioteca" aria-label="Biblioteca de Excels">&#128218;</button>
  </header>
  <div class="wrap">
    <button class="version-pill" id="activePill"></button>
    <textarea id="q" rows="2" placeholder="RPU, medidor, nombre o dirección&#10;(o pega una lista, uno por línea)" autocomplete="off" autocapitalize="characters" spellcheck="false"></textarea>
    <button class="btn btn-amber btn-big" id="btnBuscar">Buscar</button>
    <div id="results"></div>
  </div>
  <footer class="appver" id="appVer"></footer>
</section>

<!-- FICHA DEL SERVICIO -->
<section id="scr-ficha" class="screen" hidden>
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="Atrás">&#8249;</button>
    <div class="topbar-title" id="fichaTitle"></div>
    <button class="icon-btn" data-home aria-label="Nueva búsqueda">&#8962;</button>
  </header>
  <div class="trail" id="trail"></div>
  <div class="wrap" id="fichaBody"></div>
</section>

<!-- MAPA -->
<section id="scr-mapa" class="screen screen-map" hidden>
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="Atrás">&#8249;</button>
    <div class="topbar-title" id="mapaTitle">Ruta</div>
    <button class="icon-btn" id="btnLayer" aria-label="Cambiar fondo">&#127757;</button>
    <button class="icon-btn" id="btnLocate" aria-label="Mi ubicación">&#9678;</button>
  </header>
  <div id="map"></div>
  <div class="map-note" id="mapNote" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
</section>

<!-- BIBLIOTECA -->
<section id="scr-biblio" class="screen" hidden>
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="Atrás">&#8249;</button>
    <div class="topbar-title">Biblioteca de Excels</div>
    <span class="icon-btn"></span>
  </header>
  <div class="wrap">
    <label class="btn btn-amber btn-big file-btn">
      + Importar Excel (.xlsx / .xls)
      <input type="file" id="fileInput" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
    </label>
    <div id="biblioList"></div>
    <div class="storage" id="storageInfo"></div>
  </div>
</section>

<!-- IMPORTAR: CONFIRMAR COLUMNAS -->
<section id="scr-import" class="screen" hidden>
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="Cancelar">&#8249;</button>
    <div class="topbar-title">Importar Excel</div>
    <span class="icon-btn"></span>
  </header>
  <div class="wrap" id="importBody"></div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
